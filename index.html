<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بَتّ | Bat: قريبًا</title>
<meta name="description" content="بَتّ: ذكاء اصطناعي يُنجز أعمال مكتب المحاماة. قريبًا.">
<meta name="theme-color" content="#0F1318">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0F1318; --surface:#181E25; --text:#EDF1F5; --powder:#B0CDE3; --muted:#8E99A6; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
    display:grid; place-items:center; text-align:center; padding:32px;
    background-image:radial-gradient(ellipse 60% 50% at 50% 40%, #18222d 0%, var(--bg) 70%);
  }
  main { display:flex; flex-direction:column; align-items:center; gap:28px; }
  .logo { width:min(150px,40vw); height:auto; animation:rise 1.2s ease-out both; }
  h1 { font-size:clamp(28px,5vw,40px); font-weight:500; animation:rise 1.2s .2s ease-out both; }
  p { color:var(--muted); font-size:clamp(15px,2.4vw,18px); line-height:1.7; animation:rise 1.2s .35s ease-out both; }
  .en { font-family:"IBM Plex Sans",sans-serif; direction:ltr; unicode-bidi:isolate; display:inline-block; }
  .bar { width:56px; height:2px; background:var(--powder); opacity:.6; border-radius:2px; animation:pulse 2.4s ease-in-out infinite; }
  a { color:var(--powder); text-decoration:none; border-bottom:1px solid #3D5F7A; }
  a:hover,a:focus-visible { border-color:var(--powder); outline:none; }
  footer { position:fixed; bottom:20px; inset-inline:0; color:#66707C; font-size:13px; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes pulse { 50% { opacity:.2; width:28px; } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="بَتّ Bat">
  <h1>قريبًا</h1>
  <div class="bar" aria-hidden="true"></div>
  <p>ذكاء اصطناعي يُنجز أعمال مكتب المحاماة.<br>
    <span class="en">AI that gets your law firm's work done. Coming soon.</span></p>
  <p><a href="mailto:hello@try-bat.com" class="en">hello@try-bat.com</a></p>
</main>
<footer class="en">© 2026 Bat</footer>
</body>
</html>
